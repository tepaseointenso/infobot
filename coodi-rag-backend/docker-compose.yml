services:
  api:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - rag-data:/data
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  rag-data:
  qdrant-data:
